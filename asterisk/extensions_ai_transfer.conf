; extensions_ai_transfer.conf — P5: hand a live call from the AI to a human.
;
; INSTALL (on the VM):
;   /etc/asterisk/extensions_ai_transfer.conf + #include it from extensions.conf
;   asterisk -rx "dialplan reload"
;
; THE MECHANISM
;   AudioSocket() is a terminal application: while it runs, the channel is stuck
;   inside it, and the protocol gives the server no way to set a channel variable
;   or otherwise ask the dialplan to do something. So the AI cannot "return" a
;   transfer decision.
;
;   Instead the AI reaches back into Asterisk and *moves the channel*:
;     asterisk -rx "channel redirect <channel> ai-transfer,7000,1"
;   That yanks the channel out of AudioSocket (our socket then closes, which is how
;   the agent knows the call left) and lands it here.
;
;   To do that the AI needs the channel NAME, which AudioSocket also does not send.
;   The only thing it does send is the UUID — so the dialplan stashes the mapping
;   in Asterisk's own database before entering AudioSocket, and the agent reads it
;   back with "database get". No side channel, no enumeration, nothing to go stale.
;
; WHERE A REAL TRANSFER SHOULD GO
;   7000 dials a plain SIP peer, which is the lab stand-in. In production this
;   should hand off to a VICIdial in-group so a logged-in agent receives the call
;   with the lead on screen. That is a change to the Dial() line below, not to any
;   code.

[ai-transfer]
; 7000 = the real thing: announce, then ring the human agent.
exten => 7000,1,NoOp(AI transferring call to a human agent)
 same => n,Playback(ai_transfer)
 same => n,Dial(SIP/aihuman,30)
 same => n,NoOp(No human answered - dial status ${DIALSTATUS})
 same => n,Playback(ai_noagent)
 same => n,Hangup()

; 7001 = unattended test: the "human" is a recording, so the transfer path can be
; exercised with nobody logged in anywhere.
exten => 7001,1,NoOp(AI transferring call to the SIMULATED human agent)
 same => n,Playback(ai_transfer)
 same => n,Dial(Local/7002@ai-transfer,20)
 same => n,Playback(ai_noagent)
 same => n,Hangup()

exten => 7002,1,NoOp(Simulated human agent picks up)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(ai_human)
 same => n,Wait(8)
 same => n,Hangup()
