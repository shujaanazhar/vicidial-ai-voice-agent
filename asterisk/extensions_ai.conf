; extensions_ai.conf — route a test call to the host AI agent over AudioSocket.
;
; WHERE THIS GOES (on the VM):
;   Paste this context into /etc/asterisk/extensions.conf (custom section),
;   or save the file and add:  #include extensions_ai.conf
;   Then reload:  asterisk -rx "dialplan reload"
;
; WIRING THE TEST PHONE:
;   The softphone you register must land in this context (or one that includes it).
;   Either set the test phone's  context=ai-agent  in its pjsip/sip config,
;   or add  include => ai-agent  to the context it already uses.
;   Check the phone's context with:  asterisk -rx "pjsip show endpoint <name>"
;
; HOST TARGET:
;   192.168.122.1 = this host's IP on the libvirt "default" NAT network (virbr0).
;   8090          = port audiosocket_echo.py (later the AI server) listens on.
;   The UUID just identifies the call; regenerate with `uuidgen` if you like.
;
;   NOTE: the host runs ufw. This outbound connection is dropped unless the host
;   has:  ufw allow in on virbr0 to any port 8090 proto tcp
;   Symptom if missing: call connects, total silence. See docs/01_vm_setup.md §3.

[ai-agent]
exten => 5000,1,NoOp(AI agent call from ${CALLERID(num)})
 same => n,Answer()
 same => n,AudioSocket(11111111-2222-3333-4444-555555555555,192.168.122.1:8090)
 same => n,Hangup()

; Requires module app_audiosocket.so. Verify on the box:
;   asterisk -rx "module show like audiosocket"
; If missing on this Asterisk build, load it or rebuild with AudioSocket enabled.
