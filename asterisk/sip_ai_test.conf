; sip_ai_test.conf — a plain chan_sip peer for a test softphone on the host.
;
; WHY A CUSTOM PEER: VICIdial auto-generates its phones into sip-vicidial.conf
; ("ANY EDITS YOU MAKE WILL BE LOST") and lands them in context=default. Rather
; than patch VICIdial's context, this peer sits directly in context=ai-agent, so
; dialing 5000 goes straight to the AudioSocket agent with nothing in between.
;
; chan_sip is deprecated in Asterisk 18 but it is what owns UDP 5060 on ViciBox
; (PJSIP is on 5061). Matching the stack VICIdial already uses avoids a port fight.
;
; INSTALL (on the VM):
;   /etc/asterisk/sip_ai_test.conf  +  #include sip_ai_test.conf  in sip.conf
;   asterisk -rx "sip reload"
;
; REGISTER FROM THE HOST SOFTPHONE:
;   username aitest / password aitest123 / domain (SIP server) 192.168.122.10
;   then dial 5000

[aitest]
type=friend
username=aitest
secret=aitest123
host=dynamic
context=ai-agent          ; straight to the AI, bypassing VICIdial's dialplan
disallow=all
allow=ulaw,alaw           ; G.711 is already 8 kHz — no transcoding to our pipeline
directmedia=no            ; keep RTP through Asterisk; AudioSocket taps it there
nat=force_rport,comedia
qualify=yes
callerid="AI Test Softphone" <9001>
