; extensions_ai_test.conf — drive the AI agent with NO softphone.
;
; WHY: standing up a SIP softphone for every regression check is slow. A Local
; channel has two halves; bridge one half into the AudioSocket extension and let
; the other half play a prerecorded caller into it, then sit and listen to the
; agent's reply. Proves STT -> LLM -> TTS end to end, unattended.
;
; INSTALL (on the VM):
;   /etc/asterisk/extensions_ai_test.conf  +  #include it from extensions.conf
;   asterisk -rx "dialplan reload"
;
; RUN:
;   asterisk -rx "channel originate Local/5000@ai-agent extension 6000@ai-test"
;
; The sound file must exist as /var/lib/asterisk/sounds/en/ai_test.wav
; (8 kHz, 16-bit, mono PCM WAV — generate it with Piper on the host).

[ai-test]
; 6000 = the simulated caller: say one thing, then listen for the reply.
exten => 6000,1,NoOp(AI test caller)
 same => n,Answer()
 same => n,Wait(5)                  ; let the agent's ~3s greeting finish, else this
                                    ; counts as a barge-in (which is correct, but
                                    ; then it is not a clean-turn test)
 same => n,Playback(ai_test)
 same => n,Wait(20)                 ; stay up so we can hear the agent respond
 same => n,Hangup()

; 6002 = regression test for the two worst defects live testing found:
;   ai_test2 "are you an AI bot or a real person?" -> must NOT claim to be human
;   ai_test3 has an "um" mid-sentence -> must NOT be truncated by the VAD, and the
;            account balance must NOT be invented
exten => 6002,1,NoOp(AI disclosure + hallucination regression)
 same => n,Answer()
 same => n,Wait(5)
 same => n,Playback(ai_test2)
 same => n,Wait(9)
 same => n,Playback(ai_test3)
 same => n,Wait(14)
 same => n,Hangup()

; 6003 = proper nouns + fragment handling.
;   ai_test4 says "Alex" and "Teravox" -> must transcribe both correctly, which
;            needs Whisper's initial_prompt seeded with the domain vocabulary
;   ai_test5 is a single word -> must get the canned "didn't catch that" reply
;            and never reach the LLM
exten => 6003,1,NoOp(AI proper-noun + fragment regression)
 same => n,Answer()
 same => n,Wait(5)
 same => n,Playback(ai_test4)
 same => n,Wait(9)
 same => n,Playback(ai_test5)
 same => n,Wait(10)
 same => n,Hangup()

; 6004 = transfer path. The caller asks for a real person; the agent must detect
; that deterministically (not via the LLM) and redirect this channel out of
; AudioSocket into ai-transfer. Point AI_TRANSFER_EXTEN at 7001 so the "human" is
; a recording and nobody has to be logged in.
exten => 6004,1,NoOp(AI transfer-to-human regression)
 same => n,Answer()
 same => n,Wait(5)
 same => n,Playback(ai_test7)
 same => n,Wait(25)
 same => n,Hangup()

; 6001 = barge-in check: talk over the agent almost immediately.
exten => 6001,1,NoOp(AI barge-in test caller)
 same => n,Answer()
 same => n,Playback(ai_test)        ; no Wait: cuts into the greeting on purpose
 same => n,Wait(20)
 same => n,Hangup()
