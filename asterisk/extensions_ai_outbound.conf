; extensions_ai_outbound.conf — P4b: outbound calls bridged to the AI agent.
;
; INSTALL (on the VM):
;   /etc/asterisk/extensions_ai_outbound.conf  +  #include it from extensions.conf
;   asterisk -rx "dialplan reload"
;
; HOW P4b WORKS
;   Something originates a call to the lead (AMI Originate from host_ai/outbound.py,
;   or VICIdial's dialer in P5). The originate targets THIS extension, so when the
;   lead answers, the answered channel runs 5001 and lands on AudioSocket. The agent
;   speaks first, because it placed the call.
;
; WHY A SECOND EXTENSION AND A DIFFERENT UUID
;   AudioSocket hands the server exactly one piece of metadata: the 16-byte UUID.
;   Channel variables do not cross it. So the UUID is the only channel to tell the
;   agent this is an OUTBOUND call, which it must know: on outbound it has to open
;   the conversation and disclose up front that it is an AI (a legal requirement for
;   automated outbound dialing in many jurisdictions), rather than wait to be spoken
;   to. The agent maps this UUID to its outbound profile — keep the two in sync with
;   CALL_PROFILES in host_ai/ai_agent.py.
;
;   inbound  = 11111111-2222-3333-4444-555555555555  (extensions_ai.conf, ext 5000)
;   outbound = 22222222-3333-4444-5555-666666666666  (this file, ext 5001)

[ai-agent-outbound]
exten => 5001,1,NoOp(Outbound AI call to ${CALLERID(num)})
 same => n,Answer()
 same => n,AudioSocket(22222222-3333-4444-5555-666666666666,192.168.122.1:8090)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Scripted answerer, so outbound can be tested without a human picking up.
; Originate to Local/6100@ai-outbound-test instead of a real SIP peer: it answers,
; waits for the agent to open, replies with a prerecorded line, then listens.
[ai-outbound-test]
exten => 6100,1,NoOp(Simulated lead who answers an outbound AI call)
 same => n,Answer()
 same => n,Wait(6)                  ; let the agent deliver its opening line
 same => n,Playback(ai_test6)       ; "Yes, speaking. What is this about?"
 same => n,Wait(16)
 same => n,Hangup()
